name: 📦 Auto-generate bundle & docs

on:
  pull_request:
    paths:
      - "presets/**"
      - "scents.json"
      - "scripts/generate_bundle.py"
      - "scripts/generate_docs_data.py"
      - "docs/data.js"
      - ".github/workflows/build-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-bundle
  cancel-in-progress: false

jobs:
  build:
    name: 🔨 Rebuild all-presets.json + docs/data.js
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📜 Generate all-presets.json
        run: python scripts/generate_bundle.py

      - name: 🌐 Generate docs/data.js (fallback data)
        run: python scripts/generate_docs_data.py

      - name: 🔍 Check generated files
        run: |
          if git diff --quiet --ignore-matching-lines='^[[:space:]]*"generatedAt":' -- all-presets.json docs/data.js; then
            echo "✅ Generated files are up to date."
          else
            echo "❌ Generated files are stale. Run the generation scripts and commit the result."
            git diff -- all-presets.json docs/data.js
            exit 1
          fi

      - name: 📊 Summary
        if: always()
        run: |
          count=$(find presets -type f -name '*.json' | wc -l)
          echo "## 📦 Auto-build" >> $GITHUB_STEP_SUMMARY
          echo "- 🎮 Presets in repo: **$count**" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Checked: \`all-presets.json\`, \`docs/data.js\`" >> $GITHUB_STEP_SUMMARY
